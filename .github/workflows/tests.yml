name: Tests
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile application and tests
        run: python -m compileall -q ha_entity_sync tests
      - name: Run scanner tests
        run: python -m unittest discover -s tests -v

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build add-on container
        run: docker build --build-arg BUILD_FROM=python:3.13-alpine -t ha-entity-sync-smoke ha_entity_sync
      - name: Verify S6 environment wrapper is configured
        run: test "$(head -n 1 ha_entity_sync/run.sh)" = "#!/command/with-contenv bash"
      - name: Verify packaged application and startup script
        run: docker run --rm --entrypoint sh ha-entity-sync-smoke -c "test -x /app/run.sh && python -m py_compile /app/app.py /app/recovery.py && python -c 'import app, recovery'"
