<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HA Entity Sync</title>
<style>
:root{color-scheme:dark;--bg:#111820;--panel:#1b2732;--line:#30404d;--muted:#9aabb8;--text:#eef4f8;--accent:#69c4b5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:25px;margin:0 0 6px}.sub,.muted{color:var(--muted)}button{background:var(--accent);color:#10201e;border:0;border-radius:9px;padding:11px 17px;font-weight:700;cursor:pointer}
.notice{margin:20px 0;padding:13px 16px;border:1px solid #39776d;background:#17312f;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:18px 0}
.stat,.result{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}
.num{font-size:27px;font-weight:700}.label{font-size:13px;color:var(--muted)}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0d141a;color:var(--text);margin:8px 0 14px}
.result{margin:10px 0}.entity{font-weight:700;color:var(--accent);overflow-wrap:anywhere}.path{font-size:13px;color:var(--muted);margin:5px 0}.category{display:inline-block;font-size:11px;color:#d5e1e8;border:1px solid var(--line);border-radius:6px;padding:3px 7px;margin-top:4px}
.match{font:12px ui-monospace,monospace;background:#101820;padding:8px;border-radius:6px;margin-top:6px}
#status{color:var(--muted);margin:12px 0}.empty{padding:30px;text-align:center;color:var(--muted)}
</style></head>
<body><main>
<header><div><h1>HA Entity Sync</h1><div class="sub">Entity reference audit · Home Assistant local scan</div></div><button id="scan">Run read-only scan</button></header>
<div class="notice">🔒 <b>Read-only mode.</b> This version cannot rename entities or modify your Home Assistant configuration.</div>
<div id="status">Ready. Run a scan to inspect entity references.</div>
<section class="stats" id="stats"></section>
<label for="filter">Filter entity IDs or file paths</label><input id="filter" placeholder="Search results…">
<section id="results"><div class="empty">No scan results yet.</div></section>
</main>
<script>
let report=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
 if(!report)return;
 const q=$('filter').value.toLowerCase();
 const rows=report.results.filter(x=>(x.entity_id+' '+x.file).toLowerCase().includes(q));
 $('results').innerHTML=rows.length?rows.map(x=>'<article class="result"><div class="entity">'+esc(x.entity_id)+'</div><div class="path">'+esc(x.file)+' · '+x.count+' reference(s)</div><div class="category">'+esc(x.category||'Needs review')+'</div>'+x.lines.map(n=>'<div class="match">Reference at line '+n+'</div>').join('')+'</article>').join(''):'<div class="empty">No matching references.</div>';
}
$('scan').onclick=async()=>{
 $('scan').disabled=true;$('status').textContent='Scanning read-only configuration files…';
 try{
  const base=window.location.pathname.endsWith('/')?window.location.pathname:window.location.pathname+'/';
  const r=await fetch(base+'api/scan');report=await r.json();
  if(!report.ok){$('status').textContent=report.error;$('stats').innerHTML='';$('results').innerHTML='';return;}
  $('status').textContent='Scan complete. No files were changed.';
  $('stats').innerHTML=[
   ['Registered entities',report.entities_found],['Files scanned',report.files_scanned],
   ['Entities referenced',report.entities_with_references],['Reference hits',report.reference_hits]
  ,['Active configuration hits',report.category_hits?.['Active configuration']||0],['Dashboard hits',report.category_hits?.Dashboard||0],['Historical hits',report.category_hits?.Historical||0],['Needs review hits',report.category_hits?.['Needs review']||0]
  ].map(([l,n])=>'<div class="stat"><div class="num">'+n+'</div><div class="label">'+l+'</div></div>').join('');
  render();
 }catch(e){$('status').textContent='Scan failed: '+e.message;}
 finally{$('scan').disabled=false;}
};
$('filter').addEventListener('input',render);
</script></body></html>
